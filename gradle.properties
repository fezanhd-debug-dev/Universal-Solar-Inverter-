# Project-wide Gradle settings.

# Required: tells the Android Gradle Plugin this project uses AndroidX
# libraries instead of the old support library. Without this, any AndroidX
# dependency (core-ktx, navigation-compose, lifecycle, etc.) fails the build.
android.useAndroidX=true

# Not using the old support-library -> AndroidX migration tool, so jetifier
# isn't needed here, but leaving it off explicitly avoids Gradle defaulting
# to running it (which just wastes build time on a fresh project).
android.enableJetifier=false

# Kotlin code style for this project.
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself (faster incremental builds).
android.nonTransitiveRClass=true

# JVM args for the Gradle daemon — safe default heap size for CI runners.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
