name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # This repo doesn't include the Gradle wrapper (gradlew / gradle-wrapper.jar),
      # so this action provisions a matching Gradle version instead of using ./gradlew.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarSyncPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
